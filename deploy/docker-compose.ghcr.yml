# Hoppscotch Self-Host Deployment (GHCR pre-built images + PostgreSQL)
#
# Quick start:
#   1. Copy .env.example to .env and edit values
#   2. Set GHCR_OWNER below to your GitHub username or org
#   3. docker compose -f docker-compose.ghcr.yml up -d
#   4. Open http://localhost:3100 to complete onboarding

x-ghcr: &ghcr-config
  # >>> CHANGE THIS to your GitHub org/username <<<
  GHCR_OWNER: tuanzisama

services:
  hoppscotch-aio:
    container_name: hoppscotch-aio
    restart: unless-stopped
    image: ghcr.io/${GHCR_OWNER:-tuanzisama}/hoppscotch-aio:latest
    env_file:
      - ./.env
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3100:3100"
      - "3170:3170"
      - "3200:3200"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-s",
          "-o",
          "/dev/null",
          "http://localhost:3000",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  hoppscotch-db:
    container_name: hoppscotch-db
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoppscotch}
      POSTGRES_DB: ${POSTGRES_DB:-hoppscotch}
    volumes:
      - hoppscotch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hoppscotch-migrate:
    container_name: hoppscotch-migrate
    image: ghcr.io/${GHCR_OWNER:-tuanzisama}/hoppscotch-backend:latest
    env_file:
      - ./.env
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    command: sh -c "pnpm exec prisma migrate deploy"

volumes:
  hoppscotch-db-data:
